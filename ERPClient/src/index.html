<!DOCTYPE html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Tezgah — Üretim Yönetim Sistemi</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sipariş, reçete, stok ve üretim akışını tek yerden yürüten üretim yönetim sistemi."
    />
    <meta name="theme-color" content="#0f1216" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!--
      Tema, Angular açılmadan önce kök öğeye yazılıyor. Uygulama başladıktan sonra
      yazılsaydı ilk boyamada koyu tema açık ekranda bir an parlıyordu.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tz-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* gizli sekmede localStorage okunamıyor; koyu tema ile devam. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
